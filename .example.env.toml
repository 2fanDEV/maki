[database]
mongodb_uri = ""
mongodb_database = ""

[logging]
rust_log = "info"
rust_log_style = "auto"

[aws]
# Optional. When omitted, the AWS SDK credential chain must supply an account ID.
account_id = "123456789012"
# Optional. When omitted, the AWS SDK region chain is used.
region = "eu-west-1"
# Optional bucket prefix. Defaults to "default".
default_bucket = "default"
