[package]
name = "maki"
version = "0.1.0"
edition = "2024"

[dependencies]
aide = { version = "0.15.1", features = ["axum-json", "swagger"] }
anyhow = "1.0.104"
axum = "0.8.9"
env_logger = "0.11.11"
log = "0.4.34"
ndarray = "0.16.1"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
schemars = { version = "0.9", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smartcore = "0.6.14"
sprs = "=0.11.5"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
