[package]
name = "maki"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
ndarray = "0.16.1"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smartcore = "0.6.14"
sprs = "=0.11.5"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }
