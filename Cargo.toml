[package]
name = "maki"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
env_logger = "0.11.11"
log = "0.4.34"
mongodb = "3.9.0"
ndarray = "0.16.1"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
smartcore = "0.6.14"
sprs = "=0.11.5"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }
